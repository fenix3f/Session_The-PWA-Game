<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <pattern id="stripe" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#c4c5ce"/>
      <rect width="5" height="14" fill="#70727f"/>
    </pattern>
    <pattern id="stripeD" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="14" height="14" fill="#c4c5ce"/>
      <rect width="5" height="14" fill="#70727f"/>
    </pattern>
    <pattern id="stripeD2" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="14" height="14" fill="#c4c5ce"/>
      <rect width="5" height="14" fill="#70727f"/>
    </pattern>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#76624a"/>
      <stop offset="1" stop-color="#4d3e2f"/>
    </linearGradient>
  </defs>
  <style>
    .o { stroke:#16110f; stroke-width:5; stroke-linejoin:round; stroke-linecap:round; }
    .t { stroke:#16110f; stroke-width:4; stroke-linecap:round; fill:none; }
  </style>

  <!-- background -->
  <rect width="600" height="800" fill="#0a0a0b"/>

  <!-- shirt -->
  <path class="o" fill="url(#stripe)" d="M0 800 L0 530 C60 495 150 475 220 465 L380 465 C450 475 540 495 600 530 L600 800 Z"/>
  <!-- dark inside of open collar -->
  <path class="o" fill="#25252c" d="M232 480 L368 480 L300 640 Z"/>

  <!-- neck -->
  <path class="o" fill="#d2a287" d="M222 390 L222 490 C255 530 345 530 378 490 L378 390 Z"/>
  <path fill="#b88468" opacity="0.7" d="M222 410 L378 410 L378 450 C335 480 265 480 222 450 Z"/>

  <!-- collars -->
  <path class="o" fill="url(#stripeD)" d="M140 505 L225 462 L275 590 L300 650 L205 610 Z"/>
  <path class="o" fill="url(#stripeD2)" d="M460 505 L375 462 L325 590 L300 650 L395 610 Z"/>
  <path class="t" opacity="0.6" d="M300 650 L300 800"/>

  <!-- ears -->
  <path class="o" fill="#dba98e" d="M178 255 C140 240 128 310 160 350 C172 360 182 350 182 338 Z"/>
  <path class="t" d="M160 270 C150 285 152 315 165 335"/>
  <path class="o" fill="#dba98e" d="M422 255 C460 240 472 310 440 350 C428 360 418 350 418 338 Z"/>
  <path class="t" d="M440 270 C450 285 448 315 435 335"/>

  <!-- head -->
  <path class="o" fill="#e3b296" d="M165 265 C160 160 222 112 300 112 C380 112 440 160 435 265 C437 350 402 435 300 445 C198 435 163 350 165 265 Z"/>
  <!-- cheek / jaw shading -->
  <path fill="#c98f74" opacity="0.45" d="M410 290 C425 350 395 420 325 438 C385 410 405 350 410 290 Z"/>
  <path fill="#c98f74" opacity="0.4" d="M190 290 C175 350 205 420 275 438 C215 410 195 350 190 290 Z"/>
  <!-- stubble shadow -->
  <path fill="#7d6a5c" opacity="0.28" d="M195 350 C215 405 255 440 300 445 C345 440 385 405 405 350 C380 372 345 368 300 372 C255 368 220 372 195 350 Z"/>
  <path class="t" stroke-width="2" opacity="0.35" d="M240 415 l4 4 M255 425 l4 4 M270 432 l4 3 M330 432 l4 -3 M345 425 l4 -4 M360 415 l4 -4 M285 436 l3 3 M312 436 l-3 3"/>

  <!-- hair -->
  <path class="o" fill="url(#hair)" d="M160 262 C135 130 210 70 305 68 C405 68 455 130 440 262 C434 215 418 180 395 158 C340 175 250 170 205 155 C182 178 166 215 160 262 Z"/>
  <path class="t" opacity="0.5" stroke="#a08a6c" d="M215 130 C250 105 300 98 350 105"/>
  <path class="t" opacity="0.5" stroke="#a08a6c" d="M190 190 C185 210 180 232 178 252"/>
  <path class="t" opacity="0.5" stroke="#a08a6c" d="M420 185 C428 210 432 232 433 252"/>

  <!-- forehead wrinkles -->
  <path class="t" opacity="0.4" stroke-width="3" d="M225 185 C260 178 340 178 378 185"/>
  <path class="t" opacity="0.35" stroke-width="3" d="M240 200 C270 195 335 195 365 200"/>

  <!-- eyes (left) -->
  <path class="o" fill="#f6f1ea" d="M205 266 C225 246 265 246 285 266 C265 281 225 281 205 266 Z"/>
  <circle cx="245" cy="264" r="14" fill="#7c8c96" stroke="#16110f" stroke-width="3"/>
  <circle cx="245" cy="264" r="6.5" fill="#0d0a09"/>
  <circle cx="240" cy="259" r="3.3" fill="#fff"/>
  <path class="t" opacity="0.5" d="M200 272 C222 290 265 290 290 272"/>
  <!-- eyes (right) -->
  <path class="o" fill="#f6f1ea" d="M322 261 C342 241 382 241 402 261 C382 276 342 276 322 261 Z"/>
  <circle cx="362" cy="259" r="14" fill="#7c8c96" stroke="#16110f" stroke-width="3"/>
  <circle cx="362" cy="259" r="6.5" fill="#0d0a09"/>
  <circle cx="357" cy="254" r="3.3" fill="#fff"/>
  <path class="t" opacity="0.5" d="M317 267 C340 285 383 285 407 266"/>

  <!-- angry heavy lids -->
  <path fill="#e3b296" d="M196 230 L296 230 L296 276 L198 252 Z"/>
  <path class="t" stroke-width="6" d="M198 252 L290 273"/>
  <path fill="#e3b296" d="M312 228 L412 228 L410 248 L316 276 Z"/>
  <path class="t" stroke-width="6" d="M316 276 L410 248"/>

  <!-- brows -->
  <path d="M192 222 C222 222 260 236 294 258" fill="none" stroke="#4a3a2c" stroke-width="15" stroke-linecap="round"/>
  <path d="M310 258 C345 236 388 218 414 216" fill="none" stroke="#4a3a2c" stroke-width="15" stroke-linecap="round"/>
  <path class="t" opacity="0.6" d="M290 212 C292 230 294 242 296 252"/>
  <path class="t" opacity="0.6" d="M310 212 C308 230 306 242 304 252"/>

  <!-- nose -->
  <path class="t" d="M296 270 C290 305 275 330 262 345"/>
  <path class="t" d="M262 348 C282 362 322 362 342 346"/>
  <ellipse cx="278" cy="352" rx="8" ry="5" fill="#8f5f4d"/>
  <ellipse cx="326" cy="352" rx="8" ry="5" fill="#8f5f4d"/>
  <path class="t" opacity="0.4" d="M335 300 C345 320 345 335 342 346"/>
  <!-- wrinkled nose -->
  <path class="t" opacity="0.7" d="M276 282 Q300 291 326 282"/>
  <path class="t" opacity="0.7" d="M280 293 Q300 301 322 293"/>
  <!-- snarl lines -->
  <path class="t" opacity="0.65" d="M258 360 C238 378 234 402 246 420"/>
  <path class="t" opacity="0.65" d="M346 360 C366 378 370 402 358 420"/>

  <!-- mouth with snarl -->
  <path class="o" fill="#4a1414" d="M244 396 C270 378 300 383 300 383 C326 378 348 376 360 386 C356 414 280 418 244 396 Z"/>
  <path fill="#f4efe2" stroke="#16110f" stroke-width="2.5" stroke-linejoin="round" d="M256 390 C282 380 322 378 350 385 L347 400 C322 404 284 403 260 397 Z"/>
  <path class="t" stroke-width="2.5" d="M274 384 L275 401 M292 381 L292 403 M310 380 L310 404 M328 381 L328 403"/>
  <path fill="#f4efe2" stroke="#16110f" stroke-width="2.5" stroke-linejoin="round" d="M338 385 L350 385 L345 410 Z"/>
  <path fill="#e8e1cf" stroke="#16110f" stroke-width="2" d="M270 407 C290 412 316 412 334 406 L332 401 C314 405 292 405 272 401 Z"/>
  <path class="t" stroke-width="5" d="M244 396 C270 378 300 383 300 383 C326 378 348 376 360 386"/>
  <path d="M260 416 C285 424 322 422 346 408" fill="none" stroke="#b9726a" stroke-width="5" stroke-linecap="round"/>
</svg>
