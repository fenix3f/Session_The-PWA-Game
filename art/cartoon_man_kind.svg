<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <pattern id="stripe" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#c4c5ce"/>
      <rect width="5" height="14" fill="#70727f"/>
    </pattern>
    <pattern id="stripeD" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="14" height="14" fill="#c4c5ce"/>
      <rect width="5" height="14" fill="#70727f"/>
    </pattern>
    <pattern id="stripeD2" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="14" height="14" fill="#c4c5ce"/>
      <rect width="5" height="14" fill="#70727f"/>
    </pattern>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#76624a"/>
      <stop offset="1" stop-color="#4d3e2f"/>
    </linearGradient>
  </defs>
  <style>
    .o { stroke:#16110f; stroke-width:5; stroke-linejoin:round; stroke-linecap:round; }
    .t { stroke:#16110f; stroke-width:4; stroke-linecap:round; fill:none; }
  </style>

  <!-- background -->
  <rect width="600" height="800" fill="#0a0a0b"/>

  <!-- shirt -->
  <path class="o" fill="url(#stripe)" d="M0 800 L0 530 C60 495 150 475 220 465 L380 465 C450 475 540 495 600 530 L600 800 Z"/>
  <path class="o" fill="#25252c" d="M232 480 L368 480 L300 640 Z"/>

  <!-- neck -->
  <path class="o" fill="#d2a287" d="M222 390 L222 490 C255 530 345 530 378 490 L378 390 Z"/>
  <path fill="#b88468" opacity="0.7" d="M222 410 L378 410 L378 450 C335 480 265 480 222 450 Z"/>

  <!-- collars -->
  <path class="o" fill="url(#stripeD)" d="M140 505 L225 462 L275 590 L300 650 L205 610 Z"/>
  <path class="o" fill="url(#stripeD2)" d="M460 505 L375 462 L325 590 L300 650 L395 610 Z"/>
  <path class="t" opacity="0.6" d="M300 650 L300 800"/>

  <!-- ears -->
  <path class="o" fill="#dba98e" d="M178 255 C140 240 128 310 160 350 C172 360 182 350 182 338 Z"/>
  <path class="t" d="M160 270 C150 285 152 315 165 335"/>
  <path class="o" fill="#dba98e" d="M422 255 C460 240 472 310 440 350 C428 360 418 350 418 338 Z"/>
  <path class="t" d="M440 270 C450 285 448 315 435 335"/>

  <!-- head -->
  <path class="o" fill="#e8b89c" d="M165 265 C160 160 222 112 300 112 C380 112 440 160 435 265 C437 350 402 435 300 445 C198 435 163 350 165 265 Z"/>
  <path fill="#c98f74" opacity="0.4" d="M410 290 C425 350 395 420 325 438 C385 410 405 350 410 290 Z"/>
  <path fill="#c98f74" opacity="0.35" d="M190 290 C175 350 205 420 275 438 C215 410 195 350 190 290 Z"/>
  <!-- light stubble -->
  <path fill="#7d6a5c" opacity="0.2" d="M195 350 C215 405 255 440 300 445 C345 440 385 405 405 350 C380 372 345 368 300 372 C255 368 220 372 195 350 Z"/>
  <path class="t" stroke-width="2" opacity="0.3" d="M240 420 l4 4 M255 430 l4 4 M270 436 l4 3 M330 436 l4 -3 M345 430 l4 -4 M360 420 l4 -4"/>
  <!-- warm cheeks -->
  <ellipse cx="222" cy="332" rx="26" ry="15" fill="#f0988a" opacity="0.5"/>
  <ellipse cx="380" cy="330" rx="26" ry="15" fill="#f0988a" opacity="0.5"/>

  <!-- hair -->
  <path class="o" fill="url(#hair)" d="M160 262 C135 130 210 70 305 68 C405 68 455 130 440 262 C434 215 418 180 395 158 C340 175 250 170 205 155 C182 178 166 215 160 262 Z"/>
  <path class="t" opacity="0.5" stroke="#a08a6c" d="M215 130 C250 105 300 98 350 105"/>
  <path class="t" opacity="0.5" stroke="#a08a6c" d="M190 190 C185 210 180 232 178 252"/>
  <path class="t" opacity="0.5" stroke="#a08a6c" d="M420 185 C428 210 432 232 433 252"/>

  <!-- soft forehead lines -->
  <path class="t" opacity="0.3" stroke-width="3" d="M228 190 C260 183 340 183 375 190"/>

  <!-- eyes (left) -->
  <path class="o" fill="#f9f4ec" d="M205 268 C225 242 265 242 285 268 C265 287 225 287 205 268 Z"/>
  <circle cx="245" cy="266" r="16" fill="#7c8c96" stroke="#16110f" stroke-width="3"/>
  <circle cx="245" cy="266" r="7.5" fill="#0d0a09"/>
  <circle cx="239" cy="260" r="4" fill="#fff"/>
  <circle cx="252" cy="272" r="2" fill="#fff" opacity="0.8"/>
  <!-- eyes (right) -->
  <path class="o" fill="#f9f4ec" d="M322 266 C342 240 382 240 402 266 C382 285 342 285 322 266 Z"/>
  <circle cx="362" cy="264" r="16" fill="#7c8c96" stroke="#16110f" stroke-width="3"/>
  <circle cx="362" cy="264" r="7.5" fill="#0d0a09"/>
  <circle cx="356" cy="258" r="4" fill="#fff"/>
  <circle cx="369" cy="270" r="2" fill="#fff" opacity="0.8"/>
  <!-- smile crinkles -->
  <path class="t" opacity="0.6" stroke-width="3" d="M196 262 L180 254 M196 270 L178 272 M198 278 L184 288"/>
  <path class="t" opacity="0.6" stroke-width="3" d="M410 260 L426 252 M410 268 L428 270 M408 276 L422 286"/>
  <!-- lower lids lifted by smile -->
  <path class="t" opacity="0.5" d="M210 282 C232 296 262 296 282 282"/>
  <path class="t" opacity="0.5" d="M326 280 C348 294 378 294 398 280"/>

  <!-- brows: relaxed, inner ends slightly raised -->
  <path d="M192 236 C215 212 258 208 290 226" fill="none" stroke="#4a3a2c" stroke-width="14" stroke-linecap="round"/>
  <path d="M312 226 C345 206 388 210 412 234" fill="none" stroke="#4a3a2c" stroke-width="14" stroke-linecap="round"/>

  <!-- nose -->
  <path class="t" d="M296 275 C290 308 276 330 264 344"/>
  <path class="t" d="M264 348 C284 362 322 362 342 346"/>
  <ellipse cx="279" cy="352" rx="8" ry="5" fill="#9a6a58"/>
  <ellipse cx="326" cy="352" rx="8" ry="5" fill="#9a6a58"/>
  <path class="t" opacity="0.35" d="M335 302 C345 322 345 335 342 346"/>

  <!-- smile lines -->
  <path class="t" opacity="0.6" d="M258 366 C238 378 232 398 244 414"/>
  <path class="t" opacity="0.6" d="M346 366 C366 378 372 398 360 414"/>

  <!-- warm open smile -->
  <path class="o" fill="#4a1414" d="M250 392 C275 402 325 402 350 392 C346 420 318 434 300 434 C282 434 254 420 250 392 Z"/>
  <path fill="#f6f1e4" stroke="#16110f" stroke-width="2.5" stroke-linejoin="round" d="M258 395 C282 403 318 403 342 395 L339 408 C318 414 282 414 261 408 Z"/>
  <path class="t" stroke-width="2.5" d="M277 399 L278 411 M295 402 L295 413 M312 402 L312 413 M328 399 L327 411"/>
  <path fill="#c4605e" d="M276 428 C288 420 312 420 324 428 C315 434 285 434 276 428 Z"/>
  <path class="t" stroke-width="5" d="M250 392 C275 402 325 402 350 392"/>
</svg>
